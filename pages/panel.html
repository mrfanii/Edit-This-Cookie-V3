<html>
  <head>
    <link rel="stylesheet" type="text/css" href="/css/opensans/opensans.css" />
    <link rel="stylesheet" type="text/css" href="/lib/tablesorter/theme.default.css" />
    <link rel="stylesheet" type="text/css" href="/css/panel.css" />

    <script type="module" src="/js/panel.js"></script>
  </head>

  <body>
    <div id="sidebar"></div>
    <div id="main">
      <div class="datagrid">
        <table id="cookieTable" class="tablesorter">
          <thead>
            <tr>
              <th class="hiddenColumn">ID</th>
              <th class="medColumn">Name</th>
              <th>Value</th>
              <th class="medColumn">Domain</th>
              <th class="minColumn">Path</th>
              <th class="medColumn">Expires</th>
              <th class="minColumn">Session</th>
              <th class="minColumn">HostOnly</th>
              <th class="minColumn">Secure</th>
              <th class="minColumn">HttpOnly</th>
              <th class="minColumn">SameSite</th>
              <th class="hiddenColumn">StoreId</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </body>
</html>
