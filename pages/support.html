<html>
  <head>
    <link rel="stylesheet" type="text/css" href="/lib/uniform/css/default.css" />
    <link rel="stylesheet" type="text/css" href="/css/opensans/opensans.css" />
    <link rel="stylesheet" type="text/css" href="/css/font-awesome-7.3.1/css/fontawesome.min.css" />
    <link rel="stylesheet" type="text/css" href="/css/font-awesome-7.3.1/css/solid.min.css" />
    <link rel="stylesheet" type="text/css" href="/css/font-awesome-7.3.1/css/regular.min.css" />
    <link rel="stylesheet" type="text/css" href="/css/options_main_page.css" />
    <link rel="stylesheet" type="text/css" href="/css/support.css" />

    <script type="module" src="/js/support.js"></script>
    <title i18n="getting_started"></title>
  </head>

  <body>
    <div id="navigation">
      <h1>EditThisCookie</h1>
      <ul>
        <li class="chooser selected" id="support" i18n="getting_started"></li>
        <li class="chooser" id="user_preferences" i18n="Options"></li>
        <li class="chooser" id="block_rules" i18n="Blocked_Cookies"></li>
        <li class="chooser" id="readonly_rules" i18n="Protected_Cookies"></li>
      </ul>
    </div>

    <div id="support-box" class="box">
      <div class="linkify" lnk="https://editcookie.com/">
        <div class="section-title" i18n="Open_Website"></div>
        <div>
          <i class="support-icon support-icon-website fa-solid fa-globe"></i>
          <span i18n="description"></span>
        </div>
      </div>
      <hr />
      <div class="linkify" lnk="https://chromewebstore.google.com/detail/editthiscookie/ojfebgpkimhlhcblbalbfjblapadhbol/reviews">
        <div class="section-title" i18n="Rate_ETC"></div>
        <div>
          <i class="support-icon support-icon-rating fa-solid fa-star"></i>
          <span i18n="Rate_Us_Intro"></span>
        </div>
      </div>
      <hr />
      <!--<div class="linkify" lnk="http://www.getlocalization.com/editthiscookie/">
        <div class="section-title" i18n="translation"></div>
        <i class="support-icon support-icon-translations fa-solid fa-comment fa-fw"></i>
        <span i18n="translationIntro"></span>
      </div>
      <hr />-->
      <div class="linkify" lnk="https://github.com/mrfanii/Edit-This-Cookie-V3/issues">
        <div class="section-title" i18n="bugsFeatureRequest"></div>
        <i class="support-icon support-icon-issues fa-solid fa-bug"></i>
        <span i18n="bugsFeatureRequestIntro"></span>
      </div>
      <hr />
      <div class="linkify" lnk="https://github.com/mrfanii/Edit-This-Cookie-V3">
        <div class="section-title" i18n="Source_Code"></div>
        <i class="support-icon support-icon-source fa-solid fa-code"></i>
        <span i18n="Source_Code_Intro" i18n_argument="GitHub"></span>
      </div>
      <hr />
      <div class="linkify" lnk="mailto:hello@editcookie.com?Subject=About Edit This Cookie">
        <div class="section-title" i18n="contacts"></div>
        <!--        <i class="fa-regular fa-envelope"></i>-->
        <i class="support-icon support-icon-contact fa-regular fa-envelope"></i>
        <span i18n="contactsIntro"></span>
      </div>
    </div>

</html>
